name: maven-ci
type: feature
description: |
  Workflow GitHub Actions de build/tests Maven sur chaque push et PR.
  Java version paramétrée par stack.java_version, distribution Zulu,
  cache Maven natif. Si pack javafx actif, les tests TestFX tournent en
  headless via la Headless Platform JavaFX 26 (glass.platform=Headless) :
  ni xvfb ni runtime natif jdk+fx requis.
default: true
requires: []
conflicts: []
files:
  - .github/workflows/maven.yml
